[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
testnet = "${TESTNET_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# No [etherscan] block: chain 968/677 aren't in foundry-block-explorers'
# known-chain list, and declaring them here makes forge fail every
# `forge script` run (even without --verify) with "Chain 968 not supported".
# Verify with explicit CLI flags instead, e.g.:
#   forge verify-contract --chain 968 --verifier-url https://scan.bohr.life/api \
#     --etherscan-api-key $EXPLORER_API_KEY <address> <contract>

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
